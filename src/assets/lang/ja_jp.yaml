  tagInput:
    placeholder: 入力して Enter
    remove: "{value} を削除"
  ecosystem:
    more: その他 {count} 件
    less: 折りたたむ
  preview:
    empty: 生成するファイルを 1 つ以上選択してください。
    copy: このファイルをコピー
    copied: コピーしました
    download: このファイルを保存
    downloadAll: すべて zip でダウンロード
    share: 共有リンク
    shared: リンクをコピーしました
help:
  ci:
    prTypes: 既定の 3 つ（opened / synchronize / reopened）は GitHub の初期動作と同じなので、変更したときだけ YAML に書き出します。
    nodeVersions: 2 つ以上選ぶと strategy.matrix になります。
    jobs: ジョブ名は固定です。OFF にしたジョブはファイルからも auto-merge の needs からも消えます。
  deploy:
    pagesSource: 初回の実行前に、リポジトリの Settings > Pages > Source を "GitHub Actions" にしてください。
    installCommand: パッケージマネージャから自動導出します。空のままにすると追随します。
    framework: Astro を選ぶと、setup-node 〜 upload-pages-artifact が withastro/action の 1 ステップに置き換わります。
    secrets: Settings > Secrets and variables > Actions への登録が必要です。デプロイステップの env に渡されます。
    noCommand: デプロイコマンドが空のため、生成されるステップは何もしません。
  dependabot:
    directory: マニフェストの場所。リポジトリルートからの相対パスです。
    limitZero: 上限 0 はバージョン更新の停止を意味します。セキュリティ更新の PR は引き続き作られます。
    groupsAutoMerge: まとめられた更新は 1 本の PR になるため、1 度のビルド通過でまとめてマージされます。
    ignoreMajor: メジャー更新の PR 自体が作られなくなります。自動マージの対象から外すより強い設定です。
  autoMerge:
    needsDependabot: dependabot を有効にしてください。
    sameWorkflow: |-
      自動マージは ci.yml のジョブとして生成され、needs: [{jobs}] で検査の完了を待ちます。
      ruleset やブランチ保護の設定は要りません。
    noChecks: 検査ジョブが 1 つも有効になっていないため、待つ対象がなく PR が開いた直後にマージされます。
    branchProtection: |-
      この方式はリポジトリ側の設定に依存します。
      1. Settings > General > Allow auto-merge が有効であること。
      2. ブランチ保護ルール（またはルールセット）に必須ステータスチェックを設定すること。名前は ci.yml のジョブ名を使います。
      3. approve を使う場合は Settings > Actions > Allow GitHub Actions to create and approve pull requests を確認すること。
    branchProtectionNoCi: PR 時にビルドするワークフローが無いため、マージ待機の対象となるチェックがありません。
    major: major を含めると、破壊的変更がレビューなしで既定ブランチに入ります。
    noUpdateTypes: 対象の更新が 1 つも選ばれていないため、マージのステップは実行されません。
    approve: approve が必要なのは、ブランチ保護ルールがレビューを要求している場合だけです。
  output:
    generatedBy: 各ファイルの先頭に、このツールで生成したことを示す 1 行を入れます。
yaml:
  common:
    generatedBy: https://rs256.net/actions/ で生成。自由に編集してよい。
    permissions: 既定は権限なし。各ジョブで必要な分だけ付与する。
  steps:
    pnpmSetup: pnpm/action-setup はバージョンを package.json の packageManager フィールドから読む。
  ci:
    header: |-
      PR ごとに走らせる検査。ジョブ間に依存を張っていないため、
      1 回の実行で失敗をまとめて確認できる。
      https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax
    job:
      lint: 他の検査を止めずにスタイルの問題を報告する。
      test: テストを実行する。
      build: 成果物がビルドできることを確認する。
  deploy:
    headerPages: |-
      push でビルドし、GitHub Pages で公開する。
      https://docs.github.com/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site
    headerCustom: |-
      push でビルドし、任意のデプロイコマンドに渡す。
      https://docs.github.com/actions/reference/workflows-and-actions/workflow-syntax
    pagesPermissions: pages:write で成果物を公開し、id-token:write で deploy-pages が OIDC 認証する。
    pagesSetup: Settings > Pages > Source を "GitHub Actions" にしておく必要がある。
    secrets: Settings > Secrets and variables > Actions に登録しておく。
  autoMerge:
    header: |-
      検査が通った Dependabot の PR を自動でマージする。
      https://docs.github.com/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
    jobSameWorkflow: 上の検査がすべて通り、かつ Dependabot の PR のときだけマージする。
    jobNoChecks: |-
      検査ジョブが無いため待つ対象がない。PR が開いた直後にマージされる。
    jobBranchProtection: |-
      GitHub の auto-merge に載せ、必須ステータスチェックの通過まで待たせる。
      Allow auto-merge と対象ブランチのブランチ保護ルールが前提。
    permissions: Dependabot 起点の実行では GITHUB_TOKEN が既定 read-only のため、ここで明示的に付与する。
    skipMajor: メジャー更新は自動マージせず人力レビューに回す。
    approve: ブランチ保護ルールが approve を要求している場合にのみ必要。
  dependabot:
    header: |-
      依存関係の自動更新設定。
      https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
    groups: まとめられた更新は 1 本の PR になるため、1 度のビルド通過でまとめてマージされる。
    limitZero: 0 はバージョン更新の停止を意味する。セキュリティ更新の PR は引き続き作られる。
    entry:
      npm: Node.js の依存関係（package.json）。
      github-actions: .github/workflows で使っているアクション。
      pip: Python の依存関係（requirements.txt / pyproject.toml）。
      uv: uv が管理する Python の依存関係（uv.lock）。
      gradle: Java / Kotlin の依存関係（Gradle）。
      maven: Java の依存関係（pom.xml）。
      cargo: Rust のクレート（Cargo.toml）。
      gomod: Go のモジュール（go.mod）。
      composer: PHP のパッケージ（composer.json）。
      bundler: Ruby の gem（Gemfile）。
      nuget: .NET のパッケージ（*.csproj）。
      docker: Dockerfile が参照するベースイメージ。
      terraform: Terraform のプロバイダとモジュール。
      swift: Swift のパッケージ（Package.swift）。
      pub: Dart / Flutter のパッケージ（pubspec.yaml）。
      mix: Elixir のパッケージ（mix.exs）。
      devcontainers: Dev container の feature（.devcontainer）。
