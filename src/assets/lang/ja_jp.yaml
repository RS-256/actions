    reset: 初期状態に戻す
  header:
    theme: テーマ切り替え
  footer:
    copyright: © 2026 rs256 / やまゆー
    parent: rs256.net
  language:
    label: 言語
    en_us: English
    ja_jp: 日本語
  picker:
    title: 生成するファイル
    hint: 選んだものだけが下に設定として出ます。
  section:
    toggle: 設定の表示を切り替える
    offHint: このファイルは OFF です。「生成するファイル」で有効にしてください。
    common:
      title: 共通設定
      hint: 各ワークフローは、個別指定しない限りここに従います。
    ci:
      title: ci
      hint: PR のたびに走らせる検査。有効にしたジョブが並列で動きます。
    deploy:
      title: deploy
      hint: push でビルドして、結果を公開します。
    dependabot:
      title: dependabot
      hint: 監視する対象と更新の頻度を決めます。
  group:
    jobs: ジョブ
    trigger: トリガー
    build: ビルド
    ecosystems: 監視する ecosystem
    directories: ディレクトリ
    schedule: スケジュール
    options: オプション
    autoMerge: 自動マージ
  field:
    packageManager: パッケージマネージャ
    nodeVersion: Node バージョン
    nodeVersions: Node バージョン
    defaultBranch: 既定ブランチ
    timezone: タイムゾーン
    targetBranches: 対象ブランチ
    prTypes: PR のイベント
    concurrency: 実行の重複をキャンセル
    target: デプロイ先
    framework: フレームワーク
    branches: トリガーのブランチ
    manualDispatch: 手動実行を許可
    installCommand: インストールコマンド
    buildCommand: ビルドコマンド
    outputDir: 出力ディレクトリ
    cache: 依存関係をキャッシュ
    deployCommand: デプロイコマンド
    secrets: Secrets
    directory: ディレクトリ
    groupMinorPatch: マイナー / パッチをまとめる
    groupName: グループ名
    interval: 更新頻度
    day: 曜日
    time: 時刻
    openPullRequestsLimit: PR の同時オープン上限
    labels: ラベル
    commitMessagePrefix: コミットメッセージの接頭辞
    ignoreMajor: メジャー更新を無視
    autoMergeEnabled: 検査が通ったらマージ
    strategy: 方式
    updateTypes: 対象の更新
    mergeMethod: マージ方法
    approve: マージ前に approve
    generatedBy: 生成元の 1 行
  option:
    target:
      github-pages: GitHub Pages
      custom: カスタムコマンド
