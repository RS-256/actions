<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Actions Templates | rs256</title>
    <meta
      name="description"
      content="Generate GitHub Actions workflows and dependabot.yml by picking options. Runs entirely in the browser."
    />
    <meta property="og:title" content="Actions Templates | rs256" />
    <meta
      property="og:description"
      content="Generate GitHub Actions workflows and dependabot.yml by picking options."
    />
    <meta property="og:type" content="website" />
    <!-- TODO: add public/ogp.png and reference it here (see README). -->
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/actions/favicon.svg" />
    <script>
      // Prevent FOUC by resolving the theme before rendering.
      // Same storage key as rs256.net, so the setting carries over between the sites.
      (() => {
        const saved = localStorage.getItem("theme")
        const dark = saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
      })()
    </script>
  </head>
  <body class="flex min-h-svh flex-col">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
